# Port 443 catch-all — eşleşmeyen SNI/Host buraya düşer. default_server AÇIKÇA
# işaretli — nginx conf.d dosyaları alfabetik yüklendiği için bu işaret olmasa bir
# tenant ya da panel vhost'u dosya sırasına göre YANLIŞLIKLA 443'ün varsayılanı
# olabilirdi (bkz. internal/panelayarlari — panel özel domaini bu portu paylaşıyor).
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _sanalcp_default_https_;

    ssl_certificate     /etc/ssl/sanalcp/panel.crt;
    ssl_certificate_key /etc/ssl/sanalcp/panel.key;

    root /var/www/_default80;
    index index.html;

    location / {
        # =404 ŞART: son parametre bir URI olursa ve o dosya yoksa nginx sonsuz
        # iç yönlendirmeye girer ("rewrite or internal redirection cycle") ve 500 döner.
        # Sertifikası henüz olmayan domainler bu vhost'a düştüğü için o 500,
        # sitenin kendi hatası sanılıyordu.
        try_files $uri /index.html =404;
    }

    access_log /var/log/nginx/default443.access.log;
    error_log  /var/log/nginx/default443.error.log warn;
}
