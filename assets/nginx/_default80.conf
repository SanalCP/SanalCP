# Port 80 catch-all — eşleşmeyen Host header'lar buraya düşer
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _sanalcp_default_http_;

    root /var/www/_default80;
    index index.html;

    # Henüz tenant vhost'u olmayan domainler (ör. panel için seçilen özel domain) buraya
    # düşer — acme.sh HTTP-01 doğrulaması bu location olmadan 404 alır.
    location /.well-known/acme-challenge/ {
        root /var/www/_acme;
    }

    location / {
        # =404 ŞART: son parametre bir URI olursa ve o dosya yoksa nginx sonsuz
        # iç yönlendirmeye girer ("rewrite or internal redirection cycle") ve 500 döner.
        # Sertifikası henüz olmayan domainler bu vhost'a düştüğü için o 500,
        # sitenin kendi hatası sanılıyordu.
        try_files $uri /index.html =404;
    }

    access_log /var/log/nginx/default80.access.log;
    error_log  /var/log/nginx/default80.error.log warn;
}
