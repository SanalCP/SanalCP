# SANAL-LOGIN-RATELIMIT v1
# Login uç noktalarına ağ katmanında ek bir savunma: uygulama tarafındaki
# audit_log-tabanlı kilide (internal/auth/lockout.go) ek olarak, aynı IP'den
# saniyede >1 istek gelmesini engeller (bkz. aşağıdaki /api/v1/*/login blokları).
# conf.d/*.conf nginx.conf'un http{} bloğu içine include edildiği için bu
# satır burada (server{} dışında) geçerli http-context direktifidir.
limit_req_zone $binary_remote_addr zone=sanal_login:10m rate=20r/m;

# Panel admin arayüzü — port 8443 (Plesk modeli)
server {
    listen 8443 ssl default_server;
    ssl_certificate /etc/ssl/sanalcp/panel.crt;
    ssl_certificate_key /etc/ssl/sanalcp/panel.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    http2 on;
    error_page 497 =301 https://$host:$server_port$request_uri;
    listen [::]:8443 ssl default_server;
    server_name _sanalcp_panel_;

    # SANAL-PANEL-SEC v3
    # Panel guvenlik header'lari (server seviyesi; SPA + pma-signon miras alir).
    #
    # 🔴 GÜVENLİK (v2 -> v3): script-src'ten 'unsafe-inline' ve 'unsafe-eval'
    # KALDIRILDI. v2'de bunlar SUNUCU GENELİNDE aciktı — yalnizca phpMyAdmin ve
    # Roundcube'un satir-ici script'leri icin gerekmelerine ragmen panel SPA'sini
    # da kapsiyor, XSS icin en onemli savunmayi etkisiz birakiyorlardi.
    # Artik gevsetme SADECE /pma/ ve /webmail/ location'larinda (asagida).
    #
    # SPA bunu karsiliyor: Vite production cikti'si index.html'e satir-ici script
    # KOYMAZ (hepsi /assets/ altinda ayri dosya) ve pakette eval()/new Function()
    # yok (CodeMirror 6 kullaniliyor, Monaco degil — web worker/eval gerektirmez).
    # Yeni bir bagimlilik eklerken bu iki kosul dogrulanmali.
    #
    # style-src'te 'unsafe-inline' KALIYOR: React'in style={{...}} nitelikleri
    # bu direktife tabidir, kaldirmak arayuzu bozar (script-src kadar kritik degil).
    # frame-src'in genis olmasi kasitli: musteri site onizlemesi rastgele bir
    # musteri alan adini iframe'e alir (bkz. SubscriptionDetailPage.tsx).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; frame-src https: http:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # SANAL-PANEL-BODYLIMIT v1
    # 🔴 GÜVENLİK: Bu iki değer eskiden 10240m / 3600s idi ve SUNUCU GENELİNDE
    # (yani her uçta) geçerliydi — kimliği doğrulanmış bir müşteri/bayi herhangi
    # bir JSON ucuna 10 GiB gövde gönderip belleği, ya da 1 byte/sn akıtarak
    # bağlantıyı bir saat açık tutup worker'ları tüketebiliyordu.
    # Artık varsayılan dar; gerçekten büyük gövde bekleyen YÜKLEME uçları aşağıda
    # kendi location'larında istisna alır. Uygulama katmanındaki asıl sınır
    # httpx.LimitBody / httpx.ExtendBodyLimit'tir (bkz. internal/httpx/limit.go) —
    # buradaki nginx sınırı ek savunma katmanıdır, tek başına güvenilmez.
    client_max_body_size 2m;
    client_body_timeout 60s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_request_buffering off;

    root /opt/sanalcp/frontend-dist;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
        # Kendi add_header'i oldugu icin server-seviyesi guvenlik header'lari tekrar
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # SANAL-LOGIN-RATELIMIT v1 — login uç noktaları genel /api/ bloğundan önce,
    # üstteki sanal_login zone'u ile sınırlanır (burst kısa insan-hızlı yeniden
    # denemelere izin verir, nodelay kuyruklamadan reddeder).
    location = /api/v1/auth/login {
        limit_req zone=sanal_login burst=8 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # GÜVENLİK: $proxy_add_x_forwarded_for İSTEMCİNİN gönderdiği XFF'e kendi IP'sini
        # EKLER — istemci sahte bir XFF göndererek uygulama katmanındaki giriş
        # hız-sınırını (middleware.GirisLimiti) IP-rotasyonuyla atlatabilirdi. Panel bu
        # portta doğrudan erişilir (önünde başka bir güvenilir proxy yok), bu yüzden
        # $remote_addr'ın ÜZERİNE yazılır — istemci-sağlı değer asla geçmez.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/v1/musteri/login {
        limit_req zone=sanal_login burst=8 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SANAL-PANEL-BODYLIMIT v1 — büyük gövde İSTİSNASI.
    # Sunucu seviyesindeki dar varsayılan (2m) yalnız bu yükleme uçlarında açılır.
    # Regex location'lar prefix location'lardan (/api/) ÖNCE eşleşir, bu yüzden
    # aşağıdaki genel /api/ bloğunun üstünde yer alması şart değildir ama okunurluk
    # için burada tutulur. Liste, uygulamada httpx.ExtendBodyLimit çağıran uçlarla
    # birebir aynı olmalıdır — yeni bir yükleme ucu eklenirse buraya da eklenmeli.
    location ~ ^/api/v1/(domains/[^/]+/(files/upload|ice-aktarim/(arsiv|sql))|admin/transfers/(analyze|import))$ {
        client_max_body_size 20480m;
        client_body_timeout 3600s;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
    location = /healthz {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    location / {
        # SANAL-PANEL-NOCACHE v1
        # SPA index.html HER ZAMAN taze (panel guncellemesi sonrasi bayat UI + eski hash'li
        # asset referanslari onlenir). Hash'li /assets/ immutable KALIR (ayri blok).
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires 0 always;
        # Kendi add_header'i oldugu icin server-seviyesi guvenlik header'lari tekrar
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
        # SANAL-PANEL-SEC v3 — server seviyesindekiyle AYNI olmali (bu location'da
        # kendi add_header'lari oldugu icin nginx server seviyesini miras VERMEZ).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; frame-src https: http:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/panel.access.log;
    error_log  /var/log/nginx/panel.error.log warn;

# phpMyAdmin + signon endpoint (panel'in 8443 vhost'una eklenir)
# Bu dosya _panel.conf'un sonuna include edilir.

location = /pma-signon.php {
    root /opt/sanalcp/pma-signon;
    fastcgi_pass unix:/run/php-fpm/phpmyadmin.sock;
    fastcgi_param SCRIPT_FILENAME /opt/sanalcp/pma-signon/pma-signon.php;
    include fastcgi_params;
}

location ^~ /pma/ {
    alias /opt/phpmyadmin/;
    index index.php;

    # SANAL-PANEL-BODYLIMIT v1 — sunucu seviyesindeki 2m varsayılanı pma'nın SQL
    # içe aktarımını bozardı. ASIL sınır PHP tarafındadır (upload_max_filesize /
    # post_max_size = 64M, bkz. assets/php-fpm/phpmyadmin.conf); buradaki değer
    # multipart yükü için pay bırakır ki hata mesajını PHP üretsin.
    client_max_body_size 80m;

    # SANAL-PANEL-SEC v3 — 'unsafe-inline'/'unsafe-eval' gevsetmesi ARTIK SADECE
    # BURADA: phpMyAdmin satir-ici script/style uretir, panel SPA'si uretmez.
    # DIKKAT (nginx tuzagi): add_header MIRASI "hepsi ya da hicbiri"dir — bir
    # seviyede tek bir add_header tanimlanirsa ust seviyenin TUM add_header'lari
    # duser. Bu yuzden guvenlik header'larinin tamami burada tekrar yazilir;
    # yalnizca CSP yazilsaydi nosniff/HSTS/Referrer-Policy sessizce kaybolurdu.
    # Ic ice location'lar (asagidaki .php blogu) kendi add_header'i olmadigi
    # surece BU seviyeden miras alir.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location ~ ^/pma/(.+\.php)$ {
        alias /opt/phpmyadmin/$1;
        fastcgi_pass unix:/run/php-fpm/phpmyadmin.sock;
        fastcgi_param SCRIPT_FILENAME /opt/phpmyadmin/$1;
        fastcgi_param SCRIPT_NAME /pma/$1;
        include fastcgi_params;
        fastcgi_read_timeout 60s;
    }

    location ~ ^/pma/(.+\.(jpg|jpeg|gif|css|png|js|ico|html|xml|txt|svg|woff2?|map))$ {
        alias /opt/phpmyadmin/$1;
        expires 7d;
        add_header Cache-Control "public, immutable";
        # Kendi add_header'i oldugu icin server-seviyesi guvenlik header'lari tekrar
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
}

# Roundcube webmail (panel'in 8443 vhost'una eklenir, pma ile ayni desen).
# Duz mailbox girisi (e-posta + parola) — SSO yok, bkz. internal/mail paketi.
#
# GERÇEK VPS'TE BULUNDU (Roundcube 1.7): webroot artık üst dizin DEĞİL, public_html/ —
# kök index.php sadece "public_html'e yönlendirin" hatası basan bir stub. AYRICA tüm
# skin/program/plugin varlıkları (.css/.js/.svg) doğrudan dosya olarak sunulmuyor,
# static.php üzerinden PATH_INFO ile yönlendiriliyor (ör. static.php/skins/elastic/…) —
# bu yüzden static.php'yi UZANTI-BAZLI statik blok'tan ÖNCE, kendi fastcgi_split
# mantığıyla eşlemek gerekiyor, yoksa nginx onu "var olmayan bir .css dosyası" sanıp 404 verir.
location ^~ /webmail/ {
    alias /opt/roundcube/public_html/;
    index index.php;

    # SANAL-PANEL-BODYLIMIT v1 — sunucu seviyesindeki 2m varsayılanı e-posta eki
    # yüklemesini bozardı. ASIL sınır PHP tarafındadır (upload_max_filesize /
    # post_max_size = 25M, bkz. assets/php-fpm/roundcube.conf).
    client_max_body_size 32m;

    # SANAL-PANEL-SEC v3 — pma ile ayni desen: Roundcube da satir-ici script
    # uretir, gevsetme buraya hapsedilir. add_header mirasi "hepsi ya da hicbiri"
    # oldugu icin tum guvenlik header'lari tekrar yazilir (bkz. /pma/ blogu).
    # img-src'te data:/blob: e-posta govdesindeki gomulu gorseller icin gerekli.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location ~ ^/webmail/static\.php(/.+)$ {
        fastcgi_pass unix:/run/php-fpm/roundcube.sock;
        fastcgi_param SCRIPT_FILENAME /opt/roundcube/public_html/static.php;
        fastcgi_param PATH_INFO $1;
        fastcgi_param SCRIPT_NAME /webmail/static.php;
        include fastcgi_params;
        fastcgi_read_timeout 60s;
    }

    location ~ ^/webmail/(.+\.php)$ {
        alias /opt/roundcube/public_html/$1;
        fastcgi_pass unix:/run/php-fpm/roundcube.sock;
        fastcgi_param SCRIPT_FILENAME /opt/roundcube/public_html/$1;
        fastcgi_param SCRIPT_NAME /webmail/$1;
        include fastcgi_params;
        fastcgi_read_timeout 60s;
    }

    location ~ ^/webmail/(.+\.(jpg|jpeg|gif|css|png|js|ico|html|xml|txt|svg|woff2?|map))$ {
        alias /opt/roundcube/public_html/$1;
        expires 7d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Roundcube'un kendi hassas dizinleri — alias .htaccess uygulamaz, elle kapat.
    location ~ ^/webmail/(config|temp|logs|SQL|bin|tests)/ { deny all; return 404; }
}

}
