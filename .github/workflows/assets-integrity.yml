name: Assets integrity

on:
  push:
    branches: [main]
    paths:
      - "assets/**"
  pull_request:
    branches: [main]
    paths:
      - "assets/**"

jobs:
  checksum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: sha256sum -c assets/SHA256SUMS
        run: sha256sum -c assets/SHA256SUMS
