name: CI

# Her push ve PR'da: derleme, testler, statik analiz, bağımlılık taraması.
# Bu iş akışı 2026-08 güvenlik denetiminden sonra eklendi — o tarihe kadar depoda
# yazılmış _test.go dosyaları hiçbir zaman otomatik koşmuyordu ve bağımlılık
# taraması hiç yapılmamıştı.
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go — vet, test, gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Üretimde dağıtılan binary ile aynı toolchain hattı, daima en güncel yama
      # sürümü — stdlib açıkları yalnızca yamayla kapanır. go.mod'un dil sürümü
      # 1.25.0'dır (bağımlılıklar `go >= 1.25.0` istiyor); binary ise 1.26 ile
      # derlenir, çünkü 1.24 ve 1.25 hatları 1.27.0 çıkınca destekten düştü.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true

      - name: gofmt
        run: |
          set -euo pipefail
          bicimsiz=$(gofmt -l . | grep -v '^frontend/' || true)
          if [ -n "$bicimsiz" ]; then
            echo "✗ gofmt uygulanmamış dosyalar:"; echo "$bicimsiz"; exit 1
          fi
          echo "✓ gofmt temiz"

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      # internal/kaynaklimit testleri quotaon/repquota/setquota'yı exec.LookPath ile
      # arar ve bulamazsa t.Skip eder. Paket kurulu değilken kota yolu CI'da hiç
      # koşmuyordu — gerçek kapsama için `quota` paketini kuruyoruz.
      - name: quota araçlarını kur (kota testleri için)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq quota

      - name: go test
        run: go test -race -count=1 ./...

  govulncheck:
    name: Go — bağımlılık/stdlib açık taraması
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 🔴 Tarama, üretimde kullanılan Go sürümüyle yapılmalıdır: stdlib açıkları
      # kullanılan toolchain'in yama sürümüne bağlıdır. Daha yeni bir Go ile
      # taramak stdlib'i yamalı gösterip yanlış bir güvenlik hissi verirdi.
      # cache=false: 1.26.x cache'i bir önceki koşuda 1.26.5'i çekmişti ve
      # yamalar çıksa bile aynı sürümle taranıyordu — stdlib'i yamalı görmek
      # için her koşuda latest (1.26.x serisi) indirilmeli.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: false

      # Sürüm pinli; açık VERİTABANI her koşuda canlı çekilir, dolayısıyla pin
      # taramanın güncelliğini etkilemez.
      - name: govulncheck kur
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      - name: govulncheck (kaynak)
        run: |
          "$(go env GOPATH)/bin/govulncheck" ./...

      # Kaynak taraması yalnızca CI'nın derlediği kodu görür. Kurulumlara giden
      # şey depoda commit'li ÖNCEDEN DERLENMİŞ binary'dir; onu ayrıca tarıyoruz.
      # Binary eski bir Go yama sürümüyle derlendiyse bu adım kırmızı olur —
      # çözüm scripts/package-release.sh'yi güncel toolchain ile koşmaktır.
      #
      # Binary, package-release.sh'de `-ldflags "-s -w"` ile sembol tablosu
      # silinerek üretilir. govulncheck binary modunda sembol bulamayınca modül
      # düzeyine düşer ve golang.org/x/crypto'nun "openpgp paketi bakımsız"
      # uyarısını (GO-2026-5932, Fixed in: N/A), openpgp binary'de HİÇ
      # bulunmasa bile raporlar. Bu yüzden o tek kaydı istisna tutuyoruz — ama
      # istisnanın geçerliliğini önce import grafiğinden doğruluyoruz, böylece
      # ileride biri gerçekten openpgp'yi import ederse CI susmaz.
      - name: govulncheck (dağıtılan binary)
        run: |
          set -uo pipefail
          if go list -deps ./cmd/server | grep -q 'golang.org/x/crypto/openpgp'; then
            echo "::error::cmd/server artık openpgp'yi import ediyor — GO-2026-5932 istisnası geçersiz"
            exit 1
          fi
          "$(go env GOPATH)/bin/govulncheck" -mode=binary assets/sanalcp-server \
            > binary-tarama.txt 2>&1 || true
          cat binary-tarama.txt
          kalan=$(grep -oE 'GO-[0-9]{4}-[0-9]+' binary-tarama.txt \
                  | sort -u | grep -v '^GO-2026-5932$' || true)
          if [ -n "$kalan" ]; then
            echo "::error::dağıtılan binary'de açık: $kalan"
            exit 1
          fi
          echo "✓ dağıtılan binary temiz (bilinen istisna: GO-2026-5932)"

  frontend:
    name: Frontend — lint, tip kontrolü, build, npm audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        run: npm ci

      - name: lint
        run: npm run lint

      # `npm run build` = `tsc -b && vite build` — tip kontrolü buraya dahildir.
      - name: build
        run: npm run build

      - name: npm audit
        run: npm audit --audit-level=high
